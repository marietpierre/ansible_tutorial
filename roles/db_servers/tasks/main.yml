- name: install mariadb (CentOS)
  tags: mariadb,db,centos
  dnf:
    name: mariadb
    state: latest
  when: ansible_facts['distribution'] == "CentOS"

- name: install mariadb (Ubuntu)
  tags: mariadb,db,ubuntu
  apt:
    name: mariadb-server
    state: latest
  when: ansible_facts['distribution'] == "Ubuntu"
